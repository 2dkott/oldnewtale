<!DOCTYPE html>
<html>
<head>
    <title>old-tale-new-story</title>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #canvas {
            border: none;
        }
    </style>
    <script src="https://yandex.ru/games/sdk/v2"></script>
</head>
<body oncontextmenu="return false">
<div>
    <canvas id="canvas"></canvas>
</div>
<script>
    async function start() {
        main()
    }
    window.addEventListener("load", start);
</script>
<script>
    // Инициализация SDK
    window.ysdkReady = false;
    YaGames.init().then(ysdk => {
        window.ysdk = ysdk;
        window.ysdkReady = true;
        // Запуск игры после SDK
        startGame();
    }).catch(err => {
        console.error('YSDK init failed', err);
        startGame();  // Fallback
    });

    function startGame() {
        // Загрузка TeaVM JS/WASM
        const script = document.createElement('script');
        script.src = 'teavm.js';  // Или ваш targetFileName
        document.body.appendChild(script);
    }
</script>
<script type="text/javascript" charset="utf-8" src="app.js"></script>
</body>
</html>
